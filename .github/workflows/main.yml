name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git openjdk-17-jdk ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev libjpeg-dev libpng-dev libgeos-dev cython
          pip install --upgrade pip
          pip install buildozer "cython<3.0.0" virtualenv

      - name: Build APK with Buildozer
        run: |
          # GitHub के पुराने NDK पाथ को हटाकर Buildozer के NDK को प्राथमिकता दें
          unset ANDROID_NDK_HOME
          unset ANDROID_NDK_ROOT
          yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WarRoom-APK
          path: bin/*.apk
